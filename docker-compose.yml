services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dashboard212
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
    - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dashboard212
    depends_on:
      - db
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: 
      - "80:80"
    depends_on:
      - backend
volumes:
  postgres_data: